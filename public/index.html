<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flex Orchestrator</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Flex Orchestrator</h1>
      <p id="app-status">Idle</p>
    </header>

    <section aria-labelledby="create-job-heading">
      <h2 id="create-job-heading">Create Job</h2>
      <form id="create-job-form">
        <p>
          <label for="job-title">Title</label>
          <input id="job-title" name="title" type="text" required />
        </p>
        <p>
          <label for="job-model">Model</label>
          <input
            id="job-model"
            name="model"
            type="text"
            list="model-options"
            value="gpt-6-astra"
            required
          />
          <datalist id="model-options">
            <option value="gpt-6-astra"></option>
            <option value="gpt-6.1-sol"></option>
            <option value="gpt-6.1-terra"></option>
            <option value="gpt-6-luna"></option>
          </datalist>
        </p>
        <p>
          <label for="job-reasoning">Reasoning effort</label>
          <select id="job-reasoning" name="reasoningEffort">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="xhigh">Extra high</option>
            <option value="max">Max</option>
          </select>
        </p>
        <p>
          <label for="job-max-output-tokens">Max output tokens</label>
          <input
            id="job-max-output-tokens"
            name="maxOutputTokens"
            type="number"
            min="1"
            step="1"
            value="128000"
            required
          />
        </p>
        <p>
          <label for="job-cache-ttl">Cache TTL</label>
          <select id="job-cache-ttl" name="cacheTtl">
            <option value="12h" selected>12 hours</option>
            <option value="30m">30 minutes</option>
            <option value="nocache">No cache</option>
          </select>
        </p>
        <p>
          <input id="job-web-search" name="webSearch" type="checkbox" />
          <label for="job-web-search">Web search</label>
        </p>

        <fieldset>
          <legend>Developer context</legend>
          <p>
            <label for="developer-prompt">Developer prompt</label>
            <textarea id="developer-prompt" name="developerPrompt"></textarea>
          </p>
          <p>
            <label for="developer-files">Developer files</label>
            <input id="developer-files" type="file" multiple />
          </p>
        </fieldset>

        <fieldset>
          <legend>Turns</legend>
          <div id="turns">
            <div class="turn-block" data-turn-index="1">
              <div class="turn-block-header">
                <span class="turn-block-title">Turn 1</span>
                <div class="turn-block-actions">
                  <button type="button" class="turn-count">Count Tokens</button>
                  <button type="button" class="turn-remove btn-ghost btn-sm">Remove turn</button>
                </div>
              </div>
              <p>
                <label for="turn-1-prompt">Prompt</label>
                <textarea id="turn-1-prompt" class="turn-prompt"></textarea>
              </p>
              <p>
                <label for="turn-1-files">Turn files</label>
                <input id="turn-1-files" class="turn-files" type="file" multiple />
              </p>
              <div class="turn-token-result" role="status"></div>
            </div>
          </div>
          <template id="turn-template">
            <div class="turn-block" data-turn-index="0">
              <div class="turn-block-header">
                <span class="turn-block-title">Turn</span>
                <div class="turn-block-actions">
                  <button type="button" class="turn-count">Count Tokens</button>
                  <button type="button" class="turn-remove btn-ghost btn-sm">Remove turn</button>
                </div>
              </div>
              <p>
                <label for="turn-template-prompt">Prompt</label>
                <textarea id="turn-template-prompt" class="turn-prompt"></textarea>
              </p>
              <p>
                <label for="turn-template-files">Turn files</label>
                <input id="turn-template-files" class="turn-files" type="file" multiple />
              </p>
              <div class="turn-token-result" role="status"></div>
            </div>
          </template>
          <p>
            <button id="add-turn" type="button">Add turn</button>
          </p>
        </fieldset>

        <fieldset>
          <legend>Judge</legend>
          <p>
            <input id="judge-enabled" type="checkbox" />
            <label for="judge-enabled">Enable judge</label>
          </p>
          <details id="judge-details">
            <summary>Judge configuration</summary>
            <div id="judge-panel" hidden aria-disabled="true">
              <p>
                <label for="judge-model">Judge model</label>
                <input id="judge-model" name="judgeModel" type="text" value="gpt-6.1-sol" />
              </p>
              <p>
                <label for="judge-secret">Judge API Key (Env Var Name)</label>
                <input id="judge-secret" name="judgeSecret" type="text" value="OPENROUTER_API_KEY" />
              </p>
              <p>
                <label for="judge-base-url">Base URL</label>
                <input
                  id="judge-base-url"
                  name="judgeBaseUrl"
                  type="text"
                  list="judge-base-options"
                  value="https://api.openai.com/v1"
                />
                <datalist id="judge-base-options">
                  <option value="https://api.openai.com/v1"></option>
                  <option value="https://openrouter.ai/api/v1"></option>
                </datalist>
              </p>
              <p class="radio-group">
                <span class="group-label">Transport</span>
                <label><input type="radio" name="judge-transport" value="responses" checked /> Responses</label>
                <label><input type="radio" name="judge-transport" value="chat_completions" /> Completions</label>
              </p>
              <p class="radio-group">
                <span class="group-label">History</span>
                <label><input type="radio" name="judge-history" value="stateless" checked /> Stateless</label>
                <label><input type="radio" name="judge-history" value="chained" /> Chained</label>
              </p>
              <p class="radio-group">
                <span class="group-label">File delivery</span>
                <label><input type="radio" name="judge-file-delivery" value="passthrough" checked /> Passthrough</label>
                <label><input type="radio" name="judge-file-delivery" value="inline" /> Inline</label>
              </p>
              <p>
                <label for="judge-prompt">Judge developer prompt</label>
                <textarea id="judge-prompt" name="judgePrompt">You are an expert evaluator. Review the task and output. Respond with JSON: verdict (YES/NO), grade (A-F), comment (string), tag_matches_expected_step (boolean), file_visibility (boolean).</textarea>
              </p>
              <p>
                <label for="judge-grade">Minimum Acceptable Grade</label>
                <select id="judge-grade" name="judgeGrade">
                  <option value="A" selected>A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                  <option value="F">F</option>
                </select>
              </p>
              <p>
                <input id="judge-inject-fail" type="checkbox" checked />
                <label for="judge-inject-fail">Inject Critique on Failure</label>
              </p>
              <p>
                <input id="judge-inject-pass" type="checkbox" />
                <label for="judge-inject-pass">Steer Next Turn on Pass</label>
              </p>
            </div>
          </details>
        </fieldset>

        <p>
          <button type="submit">Create Job</button>
        </p>
        <p id="form-status" role="status"></p>
      </form>
    </section>

    <main id="job-list" aria-live="polite">
      <p>No jobs yet.</p>
    </main>

    <dialog id="job-dialog">
      <button type="button" id="job-dialog-close">Close</button>
      <div id="job-dialog-body"></div>
    </dialog>
  </body>
</html>
